<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Libro de videos · Páginas Clover</title>
<style>
  :root { --ink: #1d1d1f; --ink2: #6e6e73; --green: #0b7a5e; --green-d: #08614b; --bg: #fff; --bg2: #f5f5f7; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, system-ui, "Segoe UI", sans-serif; color: var(--ink); background: var(--bg2);
    min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px 16px; }
  .tarjeta { background: var(--bg); border-radius: 20px; padding: 36px 28px; max-width: 520px; width: 100%;
    box-shadow: 0 8px 30px rgba(0,0,0,.08); text-align: center; }
  .marca { color: var(--green); font-weight: 700; letter-spacing: .06em; font-size: 13px; text-transform: uppercase; }
  h1 { margin-top: 12px; font-size: 30px; line-height: 1.15; letter-spacing: -.02em; }
  p { margin-top: 14px; color: var(--ink2); font-size: 17px; line-height: 1.5; }
  .botones { margin-top: 28px; display: flex; flex-direction: column; gap: 12px; }
  a.btn { display: block; padding: 16px 20px; border-radius: 14px; font-weight: 600; font-size: 17px; text-decoration: none; }
  a.principal { background: var(--green); color: #fff; }
  a.principal:hover { background: var(--green-d); }
  a.secundario { background: var(--bg2); color: var(--ink); }
  small { display: block; margin-top: 18px; color: var(--ink2); font-size: 13px; }
</style>
</head>
<body>
  <main class="tarjeta">
    <div class="marca">Páginas Clover</div>
    <h1>Libro para aprender a hacer videos</h1>
    <p>Guía en español para Emi y Ángel: guiones, grabación, voz, textos en pantalla, música y cómo medir los reels.</p>
    <div class="botones">
      <a class="btn principal" href="Libro-videos-Paginas-Clover.pdf" download>Descargar el libro (PDF)</a>
      <a class="btn secundario" href="Libro-videos-Paginas-Clover.pdf">Leerlo acá</a>
    </div>
    <small>42 páginas · 1 MB</small>
  </main>
</body>
</html>
