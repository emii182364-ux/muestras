<body>
<header class="top"><div class="wrap">
  <a class="brand" href="index.html"><svg viewBox="0 0 32 32" aria-hidden="true"><g fill="#0B7A5E"><circle cx="11" cy="11" r="7"/><circle cx="21" cy="11" r="7"/><circle cx="11" cy="21" r="7"/><circle cx="21" cy="21" r="7"/></g><circle cx="16" cy="16" r="2.2" fill="#fff"/></svg>Páginas Clover・牙醫診所範本</a>
  <a class="back" href="index.html">← 所有範本</a>
</div></header>


<main>
<div class="wrap">
  <div class="head">
    <h1>術後與衛教須知 <span class="demo-tag">範本</span></h1>
    <p>看診結束後，診所用 LINE 把對應的注意事項傳給病患，回家也能隨時打開看。內容由醫師確認後使用，診所可以依自己的做法修改。</p>
  </div>

  <div class="tabs" role="tablist" aria-label="衛教主題">
    <button class="tab" role="tab" aria-selected="true" data-k="ext">拔牙後</button>
    <button class="tab" role="tab" aria-selected="false" data-k="imp" tabindex="-1">植牙術後</button>
    <button class="tab" role="tab" aria-selected="false" data-k="wht" tabindex="-1">美白後</button>
  </div>

  <div class="lay">
    <article class="doc" id="doc" role="tabpanel" aria-live="polite"></article>
    <aside class="side">
      <div class="card">
        <h2 class="u1">傳給病患</h2>
        <div class="lp"><div class="msg"><i>晴</i><div class="b"><div class="cv" id="lcv"></div><p id="lmsg"></p><span>打開注意事項</span></div></div></div>
        <div class="chips u2">
          <button class="btn btn-line" id="send">用 LINE 傳送（示範）</button>
          <button class="btn btn-ghost" id="print">列印</button>
        </div>
        <p class="st u3" id="st" role="status">示範：不會真的傳送。實際使用時，看診結束後系統自動傳給這位病患。</p>
      </div>
    </aside>
  </div>
</div>
</main>



<footer class="foot"><div class="wrap">範本中的診所、醫師、病患與金額皆為示範，不會送出或儲存任何資料。© 2026 Páginas Clover</div></footer>
