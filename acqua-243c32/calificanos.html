<title>Acqua Detail · Calificanos en Google</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#070b12">
<link rel="icon" href="img/logo.webp" type="image/webp">
<link rel="preload" href="fuentes/Unbounded-wght-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="estilos.css?v=13">
<script src="qr.js?v=1" defer></script>
<script src="brillitos.js?v=1" defer></script>

<body class="pagina-qr">

<div class="franja" role="note"><strong>Cartel para que tus clientes te califiquen.</strong> Mostralo desde el celular o imprimilo. <a href="index.html">← Volver a la presentación</a></div>

<main class="qr-cartel">
  <img class="qr-logo" src="img/logo.webp" width="245" height="240" alt="Acqua Detail">
  <p class="kicker">El arte del detalle</p>
  <h1>¿Te gustó cómo <em>quedó tu auto?</em></h1>
  <p class="qr-bajada">Escaneá con la cámara y dejanos tu opinión en Google. Te toma un minuto.</p>
  <a class="qr-caja" href="https://search.google.com/local/writereview?placeid=ChIJ0wp5dv2bsJUR4-9TA8P_lHI" rel="noopener" aria-label="Abrir Google para calificar a Acqua Detail">
    <img src="img/qr-calificar.png" width="300" height="300" alt="Código QR para calificar a Acqua Detail en Google">
  </a>
  <p class="estrellas-grandes" aria-hidden="true">★★★★★</p>
  <p class="qr-gracias">¡Gracias por elegirnos!</p>
  <div class="qr-acciones">
    <button type="button" class="btn btn-borde" id="imprimir">Imprimir cartel</button>
    <a class="btn btn-borde" href="https://search.google.com/local/writereview?placeid=ChIJ0wp5dv2bsJUR4-9TA8P_lHI" rel="noopener">Abrir el link</a>
  </div>
</main>
